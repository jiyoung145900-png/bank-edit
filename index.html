<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트폰 화면 커스텀 제어기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      max-width: 900px;
      width: 100%;
    }

    /* 핸드폰 외관 프레임 */
    .phone-mockup {
      width: 330px;
      height: 670px;
      background: #1f1f1f;
      border-radius: 44px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background-color: #000;
      border-radius: 34px;
      overflow: hidden;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
    }

    /* 상단 상태바 (시간, 이모티콘 등) */
    .status-bar {
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 22px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    .status-right {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* 컨트롤 패널 */
    .control-panel {
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 320px;
    }
    .control-panel h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #222;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .form-group input[type="text"],
    .form-group input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input[type="text"]:focus {
      border-color: #007aff;
    }
    .form-group input[type="file"] {
      background: #f8f9fa;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 핸드폰 프레임 -->
    <div class="phone-mockup">
      <div class="phone-screen" id="phoneScreen">
        <div class="status-bar">
          <span id="displayTime">10:00</span>
          <div class="status-right">
            <span id="displayEmoji">❤️✨</span>
            <span>🔋</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 제어 컨트롤러 -->
    <div class="control-panel">
      <h2>📱 화면 제어 설정</h2>
      
      <div class="form-group">
        <label for="timeInput">상단 시간 변경</label>
        <input type="text" id="timeInput" value="10:00" placeholder="예: 10:00" />
      </div>

      <div class="form-group">
        <label for="emojiInput">이모티콘 변경</label>
        <input type="text" id="emojiInput" value="❤️✨" placeholder="이모티콘 입력" />
      </div>

      <div class="form-group">
        <label for="imageInput">배경/이미지 업로드</label>
        <input type="file" id="imageInput" accept="image/*" />
      </div>
    </div>
  </div>

  <script>
    const timeInput = document.getElementById('timeInput');
    const emojiInput = document.getElementById('emojiInput');
    const imageInput = document.getElementById('imageInput');

    const displayTime = document.getElementById('displayTime');
    const displayEmoji = document.getElementById('displayEmoji');
    const phoneScreen = document.getElementById('phoneScreen');

    // 시간 입력 시 실시간 적용
    timeInput.addEventListener('input', (e) => {
      displayTime.textContent = e.target.value || '10:00';
    });

    // 이모티콘 입력 시 실시간 적용
    emojiInput.addEventListener('input', (e) => {
      displayEmoji.textContent = e.target.value;
    });

    // 이미지 파일 선택 시 화면 배경 변경
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
          phoneScreen.style.backgroundImage = `url('${event.target.result}')`;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
