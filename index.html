<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고품질 모바일 상단바 & 화면 커스텀 제어기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    body {
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px 15px;
    }
    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1200px;
      width: 100%;
    }

    /* 프리뷰 영역 */
    .preview-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 20px;
    }
    .phone-wrapper {
      background: #111;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      position: relative;
    }
    .phone-wrapper.no-frame {
      background: transparent;
      padding: 0;
      border-radius: 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .phone-screen {
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      border-radius: 30px;
      transition: width 0.3s ease, height 0.3s ease;
    }
    .phone-wrapper.no-frame .phone-screen {
      border-radius: 0;
    }

    /* 상단바 (Status Bar) */
    .status-bar {
      height: 38px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      color: #000000;
      font-size: 14px;
      font-weight: 700;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(5px);
      user-select: none;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .carrier-text {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .time-text {
      font-size: 14px;
      font-weight: 700;
      margin-left: 2px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 커스텀 아이콘 등록 목록 배치 영역 */
    .custom-icons-container {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .custom-status-icon {
      height: 16px;
      width: auto;
      object-fit: contain;
    }

    /* 시스템 SVG 아이콘 */
    .sys-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* 갤럭시 배터리 (기본) */
    .battery-box {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #767676;
      color: #ffffff;
      border-radius: 10px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 800;
      min-width: 32px;
      height: 18px;
      line-height: 1;
    }
    .battery-box::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 5px;
      width: 2px;
      height: 8px;
      background: #767676;
      border-radius: 0 2px 2px 0;
    }

    /* 아이폰 배터리 */
    .battery-box.iphone-style {
      background: transparent;
      color: currentColor;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      padding: 1px 3px;
      min-width: 24px;
      height: 11px;
      font-size: 9px;
      font-weight: 700;
    }
    .battery-box.iphone-style::after {
      display: none;
    }

    /* 하단 내비게이션 바 (안드로이드) */
    .nav-bar {
      height: 40px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: auto;
      padding-bottom: 5px;
      z-index: 90;
      background: rgba(255, 255, 255, 0.9);
    }
    .nav-btn {
      width: 18px;
      height: 18px;
      opacity: 0.6;
    }

    /* 컨트롤 패널 UI */
    .control-panel {
      background: #ffffff;
      border-radius: 20px;
      padding: 25px;
      width: 460px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-height: 90vh;
      overflow-y: auto;
    }
    .control-panel h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #111;
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 10px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #007aff;
      margin: 18px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 5px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group {
      flex: 1;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    input[type="text"]:focus, select:focus {
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.1);
    }
    input[type="file"] {
      font-size: 12px;
    }

    /* 등록된 아이콘 관리 박스 */
    .icon-manager {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
    }
    .registered-icon-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid #eee;
    }
    .icon-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .icon-info img {
      height: 20px;
      width: 20px;
      object-fit: contain;
    }
    .btn {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0056b3; }
    .btn-danger { background: #ff3b30; }
    .btn-danger:hover { background: #d32f2f; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }
    .btn-download {
      background: #34C759;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 13px;
    }
    .btn-download:hover { background: #30B050; }

    .color-picker-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-picker-group input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .download-info {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- 왼쪽 핸드폰 실시간 미리보기 -->
    <div class="preview-section">
      <div class="phone-wrapper" id="phoneWrapper">
        <div class="phone-screen" id="phoneScreen" style="width: 360px; height: 780px;">
          
          <!-- 상단바 (Status Bar) -->
          <div class="status-bar" id="statusBar">
            <div class="status-left">
              <span class="carrier-text" id="displayCarrier">U⁺</span>
              <span class="time-text" id="displayTime">12:17</span>
            </div>

            <div class="status-right">
              <!-- 사용자가 등록하고 선택한 아이콘들이 들어가는 위치 -->
              <div class="custom-icons-container" id="activeCustomIcons"></div>

              <!-- 기본 시스템 아이콘 (진동/LTE/안테나) -->
              <span class="sys-icon" id="iconVibrate">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M0 15h2V9H0v6zm3 2h2V7H3v10zm18-10v10h2V7h-2zm-3 12h2V5h-2v14zM7 19h10V5H7v14z"/>
                </svg>
              </span>
              <span class="sys-icon" id="iconLte">
                <svg width="22" height="13" viewBox="0 0 30 16" fill="currentColor">
                  <text x="0" y="13" font-size="12" font-weight="900" font-family="sans-serif">LTE</text>
                </svg>
              </span>
              <span class="sys-icon" id="iconSignal">
                <svg width="16" height="14" viewBox="0 0 20 16" fill="currentColor">
                  <rect x="1" y="12" width="3" height="4" rx="0.5"/>
                  <rect x="6" y="8" width="3" height="8" rx="0.5"/>
                  <rect x="11" y="4" width="3" height="12" rx="0.5"/>
                  <rect x="16" y="0" width="3" height="16" rx="0.5"/>
                </svg>
              </span>

              <!-- 실제 배터리 (기기별 스타일 변함) -->
              <div class="battery-box" id="batteryBox">
                <span id="displayBattery">81</span>
              </div>
            </div>
          </div>

          <!-- 하단 내비게이션 바 -->
          <div class="nav-bar" id="navBar">
            <svg class="nav-btn" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            <svg class="nav-btn" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            <svg class="nav-btn" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
          </div>

        </div>
      </div>

      <!-- JPG 다운로드 버튼 -->
      <button class="btn btn-download" id="btnDownloadJpg">📥 화면 이미지 JPG 다운로드</button>
      <div class="download-info">프레임 제외 화면 영역만 저장됩니다</div>
    </div>

    <!-- 오른쪽 상세 제어 컨트롤 패널 -->
    <div class="control-panel">
      <h2>⚙️ 모바일 화면 커스텀 설정</h2>

      <!-- 1. 기종 및 화면 크기 설정 -->
      <div class="section-title">1. 화면 크기 & 프레임 설정</div>
      <div class="form-group">
        <label for="devicePreset">기종 / 사이즈 프리셋 선택</label>
        <select id="devicePreset">
          <option value="custom-screenshot">캡처 이미지 비율 (360 x 780)</option>
          <option value="galaxy-s24">삼성 갤럭시 S24 (360 x 780)</option>
          <option value="galaxy-ultra">삼성 갤럭시 S24 Ultra (384 x 854)</option>
          <option value="iphone-15">아이폰 15 Pro (393 x 852)</option>
          <option value="custom">직접 수동 입력</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="screenWidth">가로 너비 (px)</label>
          <input type="number" id="screenWidth" value="360" />
        </div>
        <div class="form-group">
          <label for="screenHeight">세로 높이 (px)</label>
          <input type="number" id="screenHeight" value="780" />
        </div>
      </div>

      <div class="form-group">
        <label><input type="checkbox" id="toggleFrame" checked /> 외각 스마트폰 프레임 표시</label>
      </div>

      <!-- 2. 통신사 및 시간 설정 -->
      <div class="section-title">2. 통신사 & 시계 설정</div>
      <div class="form-row">
        <div class="form-group">
          <label for="carrierSelect">통신사 선택</label>
          <select id="carrierSelect">
            <option value="U⁺">U⁺ (유플러스)</option>
            <option value="SKT">SKT</option>
            <option value="kt">kt (알뜰폰/올레)</option>
            <option value="custom">직접 입력</option>
            <option value="">표시 안 함</option>
          </select>
        </div>
        <div class="form-group">
          <label for="customCarrierInput">통신사 수동 입력</label>
          <input type="text" id="customCarrierInput" placeholder="예: KT" disabled />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="timeInput">상단바 시간</label>
          <input type="text" id="timeInput" value="12:17" />
        </div>
        <div class="form-group">
          <label for="batteryInput">배터리 잔량 (%)</label>
          <input type="number" id="batteryInput" value="81" min="0" max="100" />
        </div>
      </div>

      <!-- 3. 상단바 스타일 & 시스템 아이콘 토글 -->
      <div class="section-title">3. 상단바 텍스트/아이콘 색상</div>
      <div class="form-row">
        <div class="form-group">
          <label>상단바 글자/아이콘 색상</label>
          <div class="color-picker-group">
            <input type="color" id="statusColor" value="#000000" />
            <span id="colorHexText">#000000</span>
          </div>
        </div>
        <div class="form-group">
          <label>상단바 배경 투명도/색상</label>
          <div class="color-picker-group">
            <input type="color" id="statusBgColor" value="#ffffff" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label style="margin-bottom: 8px;">기본 시스템 아이콘 토글</label>
        <div style="display: flex; gap: 15px; font-size: 13px;">
          <label><input type="checkbox" id="toggleVibrate" checked /> 진동</label>
          <label><input type="checkbox" id="toggleLte" checked /> LTE</label>
          <label><input type="checkbox" id="toggleSignal" checked /> 안테나</label>
          <label><input type="checkbox" id="toggleNav" checked /> 하단바</label>
        </div>
      </div>

      <!-- 4. 커스텀 아이콘 등록 및 관리 -->
      <div class="section-title">4. 나만의 아이콘 등록 및 배치</div>
      <div class="form-group">
        <label for="iconFileInput">아이콘 이미지 파일 추가 (PC에서 선택)</label>
        <input type="file" id="iconFileInput" accept="image/*" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="iconNameInput">아이콘 이름/식별자</label>
          <input type="text" id="iconNameInput" placeholder="예: 카톡, 알림 등" />
        </div>
        <div class="form-group" style="display: flex; align-items: flex-end;">
          <button class="btn" id="btnAddIcon" style="width: 100%;">아이콘 라이브러리 등록</button>
        </div>
      </div>

      <div class="icon-manager">
        <label style="font-size: 12px; font-weight:700; color:#666; margin-bottom:8px; display:block;">
          등록된 아이콘 목록 (체크박스로 상단바에 표시/해제)
        </label>
        <div id="iconListContainer">
          <div style="font-size: 12px; color: #999; text-align: center; padding: 10px;">
            등록된 커스텀 아이콘이 없습니다.
          </div>
        </div>
      </div>

      <!-- 5. 배경 및 캡처 이미지 업로드 -->
      <div class="section-title">5. 화면 전체 배경 / 캡처 이미지</div>
      <div class="form-group">
        <label for="bgFileInput">배경 / 거래내역 캡처 이미지 업로드</label>
        <input type="file" id="bgFileInput" accept="image/*" />
      </div>

    </div>
  </div>

  <script>
    // 1. DOM 엘리먼트 가져오기
    const phoneWrapper = document.getElementById('phoneWrapper');
    const phoneScreen = document.getElementById('phoneScreen');
    const statusBar = document.getElementById('statusBar');
    const displayCarrier = document.getElementById('displayCarrier');
    const displayTime = document.getElementById('displayTime');
    const displayBattery = document.getElementById('displayBattery');
    const batteryBox = document.getElementById('batteryBox');
    const navBar = document.getElementById('navBar');

    const devicePreset = document.getElementById('devicePreset');
    const screenWidth = document.getElementById('screenWidth');
    const screenHeight = document.getElementById('screenHeight');
    const toggleFrame = document.getElementById('toggleFrame');

    const carrierSelect = document.getElementById('carrierSelect');
    const customCarrierInput = document.getElementById('customCarrierInput');
    const timeInput = document.getElementById('timeInput');
    const batteryInput = document.getElementById('batteryInput');

    const statusColor = document.getElementById('statusColor');
    const colorHexText = document.getElementById('colorHexText');
    const statusBgColor = document.getElementById('statusBgColor');

    const toggleVibrate = document.getElementById('toggleVibrate');
    const toggleLte = document.getElementById('toggleLte');
    const toggleSignal = document.getElementById('toggleSignal');
    const toggleNav = document.getElementById('toggleNav');

    const iconVibrate = document.getElementById('iconVibrate');
    const iconLte = document.getElementById('iconLte');
    const iconSignal = document.getElementById('iconSignal');
    
    const iconFileInput = document.getElementById('iconFileInput');
    const iconNameInput = document.getElementById('iconNameInput');
    const btnAddIcon = document.getElementById('btnAddIcon');
    const iconListContainer = document.getElementById('iconListContainer');
    const activeCustomIcons = document.getElementById('activeCustomIcons');

    const bgFileInput = document.getElementById('bgFileInput');
    const btnDownloadJpg = document.getElementById('btnDownloadJpg');

    // 2. 상태(State) 변수 관리
    let customIcons = [];

    // 3. 화면 크기 및 프레임 업데이트 로직
    function updateScreenSize() {
      phoneScreen.style.width = screenWidth.value + 'px';
      phoneScreen.style.height = screenHeight.value + 'px';
    }

    screenWidth.addEventListener('input', updateScreenSize);
    screenHeight.addEventListener('input', updateScreenSize);

    devicePreset.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'galaxy-s24' || val === 'custom-screenshot') {
        screenWidth.value = 360; 
        screenHeight.value = 780;
      } else if (val === 'galaxy-ultra') {
        screenWidth.value = 384; 
        screenHeight.value = 854;
      } else if (val === 'iphone-15') {
        screenWidth.value = 393; 
        screenHeight.value = 852;
      }
      updateScreenSize();
    });

    toggleFrame.addEventListener('change', (e) => {
      if (e.target.checked) {
        phoneWrapper.classList.remove('no-frame');
      } else {
        phoneWrapper.classList.add('no-frame');
      }
    });

    // 4. 통신사, 시간, 배터리 업데이트 로직
    carrierSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'custom') {
        customCarrierInput.disabled = false;
        displayCarrier.textContent = customCarrierInput.value;
      } else {
        customCarrierInput.disabled = true;
        displayCarrier.textContent = val;
      }
    });

    customCarrierInput.addEventListener('input', (e) => {
      if (carrierSelect.value === 'custom') {
        displayCarrier.textContent = e.target.value;
      }
    });

    timeInput.addEventListener('input', (e) => {
      displayTime.textContent = e.target.value;
    });

    batteryInput.addEventListener('input', (e) => {
      displayBattery.textContent = e.target.value;
    });

    // 5. 색상 및 시스템 아이콘 토글 로직
    statusColor.addEventListener('input', (e) => {
      const color = e.target.value;
      statusBar.style.color = color;
      colorHexText.textContent = color;
    });

    statusBgColor.addEventListener('input', (e) => {
      statusBar.style.background = e.target.value;
    });

    toggleVibrate.addEventListener('change', (e) => {
      iconVibrate.style.display = e.target.checked ? 'inline-flex' : 'none';
    });

    toggleLte.addEventListener('change', (e) => {
      iconLte.style.display = e.target.checked ? 'inline-flex' : 'none';
    });

    toggleSignal.addEventListener('change', (e) => {
      iconSignal.style.display = e.target.checked ? 'inline-flex' : 'none';
    });

    toggleNav.addEventListener('change', (e) => {
      navBar.style.display = e.target.checked ? 'flex' : 'none';
    });

    // 6. 나만의 커스텀 아이콘 등록/관리 로직
    btnAddIcon.addEventListener('click', () => {
      const file = iconFileInput.files[0];
      const name = iconNameInput.value.trim() || '이름 없음';

      if (!file) {
        alert('이미지 파일을 선택해주세요.');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const id = 'icon_' + Date.now();
        customIcons.push({
          id: id,
          name: name,
          src: e.target.result,
          active: false
        });
        renderIconList();
        
        // 입력 필드 초기화
        iconFileInput.value = '';
        iconNameInput.value = '';
      };
      reader.readAsDataURL(file);
    });

    function renderIconList() {
      if (customIcons.length === 0) {
        iconListContainer.innerHTML = '<div style="font-size: 12px; color: #999; text-align: center; padding: 10px;">등록된 커스텀 아이콘이 없습니다.</div>';
        return;
      }
      
      iconListContainer.innerHTML = '';
      
      customIcons.forEach(icon => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'registered-icon-item';
        
        itemDiv.innerHTML = `
          <div class="icon-info">
            <input type="checkbox" id="chk_${icon.id}" ${icon.active ? 'checked' : ''}>
            <img src="${icon.src}" alt="${icon.name}">
            <label for="chk_${icon.id}">${icon.name}</label>
          </div>
          <button class="btn btn-danger btn-sm" data-id="${icon.id}">삭제</button>
        `;

        // 체크박스 변경 시 상태 업데이트
        const checkbox = itemDiv.querySelector('input[type="checkbox"]');
        checkbox.addEventListener('change', (e) => {
          icon.active = e.target.checked;
          renderActiveIcons();
        });

        // 삭제 버튼 클릭 시 리스트에서 제거
        const delBtn = itemDiv.querySelector('button');
        delBtn.addEventListener('click', (e) => {
          const targetId = e.target.getAttribute('data-id');
          customIcons = customIcons.filter(c => c.id !== targetId);
          renderIconList();
          renderActiveIcons();
        });

        iconListContainer.appendChild(itemDiv);
      });
    }

    function renderActiveIcons() {
      activeCustomIcons.innerHTML = '';
      
      const activeList = customIcons.filter(icon => icon.active);
      activeList.forEach(icon => {
        const img = document.createElement('img');
        img.src = icon.src;
        img.className = 'custom-status-icon';
        img.alt = icon.name;
        activeCustomIcons.appendChild(img);
      });
    }

    // 7. 전체 배경 이미지 처리
    bgFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        phoneScreen.style.backgroundImage = `url(${event.target.result})`;
      };
      reader.readAsDataURL(file);
    });

    // 8. JPG 캡처 다운로드 (html2canvas 활용)
    btnDownloadJpg.addEventListener('click', () => {
      // 폰 프레임 제외한 phoneScreen 내부 영역만 캡처
      html2canvas(phoneScreen, { 
        scale: 2, // 고해상도 처리
        useCORS: true,
        backgroundColor: null 
      }).then(canvas => {
        const imgUrl = canvas.toDataURL('image/jpeg', 1.0);
        const downloadLink = document.createElement('a');
        downloadLink.href = imgUrl;
        downloadLink.download = 'custom_mobile_screen.jpg';
        downloadLink.click();
      }).catch(err => {
        alert('이미지 생성 중 오류가 발생했습니다: ' + err.message);
      });
    });

  </script>
</body>
</html>
